name: cla

# Contributor License Agreement check. See docs/CLA.md and docs/LICENSING.md.
#
# MANUAL ACTIVATION REQUIRED — this workflow is inert until a maintainer:
#   1. Creates a Personal Access Token (classic, `repo` scope) on an account
#      that can write to the signatures store, and adds it as the
#      `CLA_SIGNATURES_TOKEN` repository secret.
#   2. Creates an empty private repo `plenoai/cla-signatures` (or points
#      `path-to-storage` / `remote-repository-name` below at another store).
# Until the secret exists the `sign` job no-ops via the guard on `env.ACTIVE`,
# so PRs are never blocked by an unconfigured bot.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    env:
      # Flips to a non-empty value the moment the secret is configured.
      ACTIVE: ${{ secrets.CLA_SIGNATURES_TOKEN != '' }}
    steps:
      - name: CLA assistant
        if: >-
          env.ACTIVE == 'true' &&
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
           || github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/plenoai/pleno-dlp/blob/main/docs/CLA.md
          path-to-signatures: signatures/version1/cla.json
          remote-repository-name: cla-signatures
          branch: main
          custom-notsigned-prcomment: >-
            Thanks for your contribution. Before we can merge, please sign the
            [Contributor License Agreement](https://github.com/plenoai/pleno-dlp/blob/main/docs/CLA.md)
            by posting the following comment on this PR:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: false
