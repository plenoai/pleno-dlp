name: sisakulint

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install sisakulint
        run: go install github.com/sisaku-security/sisakulint/cmd/sisakulint@v0.3.8
      # Runners are ephemeral and keep no state between jobs, so the
      # self-hosted-runner rule is suppressed. The dependabot-ecosystem finding
      # for bundler is suppressed too: release.yml's homebrew job uses
      # ruby/setup-ruby only for an interpreter and the repository has no
      # Gemfile, so Dependabot has no bundler manifest to update.
      # Findings are reported as warnings (log + annotations) without failing
      # the job, matching the previous sisakulint-action behaviour.
      # The job token lifts the anonymous 60 req/h GitHub API limit used by
      # the known-vulnerable-actions and commit-sha checks.
      - name: Run sisakulint
        env:
          SISAKULINT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$("$(go env GOPATH)/bin/sisakulint" -ignore self-hosted-runner -ignore 'package ecosystem "bundler" is used \(detected from ruby/setup-ruby\)' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" | grep -v '^[[:space:]]*$' | while IFS= read -r line; do
              printf '::warning title=sisakulint::%s\n' "$line"
            done
            echo "::warning title=sisakulint::sisakulint exited with status $status; findings reported as warnings"
          fi
