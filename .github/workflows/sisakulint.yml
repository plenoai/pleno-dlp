name: sisakulint

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install sisakulint
        run: go install github.com/sisaku-security/sisakulint/cmd/sisakulint@v0.3.8
      - name: Run sisakulint
        # self-hosted runners are ephemeral and do not persist state between
        # jobs, so the self-hosted-runner rule is suppressed.
        run: sisakulint -ignore self-hosted-runner
