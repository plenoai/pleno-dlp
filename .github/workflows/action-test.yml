name: action-test

# Exercises the composite action in action.yml end to end: download the
# pinned release binary, cosign-verify it, run a scan, and check the SARIF
# output. Pinned to a real, already-published release (not `latest`) so the
# test is deterministic and doesn't depend on this PR's own release.
#
# The scan target is .github/action-smoke/, a committed, prose-only,
# secret-free fixture — NOT docs/. docs/ documents a secrets scanner and so
# contains secret-shaped strings by design (detector key-format tables,
# example audit-trail records), which trip --fail-on high and can never be
# guaranteed clean. Scanning the dedicated fixture keeps this smoke test
# deterministic and immune to documentation drift.
on:
  pull_request:
    paths:
      - "action.yml"
      - ".github/workflows/action-test.yml"
      - ".github/action-smoke/**"
  push:
    branches: ["main"]
    paths:
      - "action.yml"
      - ".github/workflows/action-test.yml"
      - ".github/action-smoke/**"

permissions:
  contents: read

env:
  # Bump when cutting a release, so the smoke test tracks a real signed
  # artifact instead of drifting to `latest`.
  PLENO_DLP_SMOKE_VERSION: v0.59.0

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run pleno-dlp action against a secret-free target
        id: scan
        uses: ./
        with:
          target: .github/action-smoke
          version: ${{ env.PLENO_DLP_SMOKE_VERSION }}
          sarif-file: ${{ runner.temp }}/pleno-dlp-results.sarif

      - name: Validate SARIF output
        shell: bash
        env:
          PLENO_DLP_SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -euo pipefail
          file="$PLENO_DLP_SARIF_FILE"
          test -s "$file"
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              doc = json.load(f)
          assert doc['version'] == '2.1.0', doc.get('version')
          assert doc['runs'][0]['tool']['driver']['name']
          # The fixture is secret-free by construction, so a passing scan must
          # report zero results. A nonzero count means the fixture was
          # contaminated — fail loudly instead of shipping a dirty smoke target.
          results = doc['runs'][0]['results']
          assert results == [], f'expected 0 findings on secret-free fixture, got {len(results)}'
          " "$file"
