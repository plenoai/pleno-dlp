name: release-native

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  wait-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    steps:
      - name: Wait for the signed release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          attempts=80
          sleep_s=30
          for i in $(seq 1 "$attempts"); do
            release_run=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?event=push&head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
            if [ -z "$release_run" ]; then
              echo "release.yml not visible yet (attempt $i/$attempts)"
              sleep "$sleep_s"
              continue
            fi
            state=$(gh run view "$release_run" --repo "$REPO" --json status,conclusion --jq '.status + " " + (.conclusion // "")' 2>/dev/null || true)
            case "$state" in
              "completed success")
                seen=$(gh release view "$TAG" --repo "$REPO" --json tagName --jq '.tagName' 2>/dev/null || true)
                if [ "$seen" = "$TAG" ]; then
                  exit 0
                fi
                echo "release.yml succeeded; waiting for release $TAG (attempt $i/$attempts)"
                ;;
              completed\ *)
                echo "::error::release.yml concluded $state; refusing native publication" >&2
                exit 1
                ;;
              *)
                echo "release.yml is $state (attempt $i/$attempts)"
                ;;
            esac
            sleep "$sleep_s"
          done
          echo "::error::release.yml did not complete successfully for $TAG" >&2
          exit 1

  native:
    needs: wait-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - run: cmake --version

      - name: Build native binary
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: make opf-native-build OPF_NATIVE_LDFLAGS="-s -w -X main.version=$TAG -X main.commit=$COMMIT"

      - name: Test native build
        run: make opf-native-test

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package archive, checksum, and SBOM
        env:
          ASSET: pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist-native/stage
          cp bin/pleno-dlp-opf dist-native/stage/pleno-dlp
          cp LICENSE README.md THIRD_PARTY_NOTICES dist-native/stage/
          tar -C dist-native/stage -czf "dist-native/${ASSET}.tar.gz" .
          cd dist-native
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          else
            shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          fi
          syft "${ASSET}.tar.gz" -o "spdx-json=${ASSET}.tar.gz.spdx.json"

      - name: Sign native archive
        env:
          ASSET: pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}
        run: cosign sign-blob --yes --bundle "dist-native/${ASSET}.tar.gz.sigstore.json" "dist-native/${ASSET}.tar.gz"

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.spdx.json

      - name: Attach trusted native assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "dist-native/${ASSET}.tar.gz" \
            "dist-native/${ASSET}.tar.gz.sha256" \
            "dist-native/${ASSET}.tar.gz.sigstore.json" \
            "dist-native/${ASSET}.tar.gz.spdx.json" \
            --repo "${{ github.repository }}" --clobber
