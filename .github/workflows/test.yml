name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, arm64, hikae-long]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Git with offline promisor-object support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git
          git --version
      - name: Record clean runner capacity
        run: |
          go clean -cache
          {
            df -Pk "$GITHUB_WORKSPACE" /tmp
            go env GOCACHE GOMODCACHE
            du -sk /opt/hostedtoolcache/go "$(go env GOCACHE)" "$(go env GOMODCACHE)" 2>/dev/null || true
          } | tee "$RUNNER_TEMP/disk-before-validation.txt"
      - name: Preserve capacity evidence before compilation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flash-disk-before-validation
          path: ${{ runner.temp }}/disk-before-validation.txt
          if-no-files-found: error
          retention-days: 1
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go vet ./...
      - name: govulncheck
        run: |
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -json ./... > "$report"
          # ponytail: GO-2026-5932 has no fixed version and only a module-level
          # trace; remove this exception when x/crypto or go-git ships a fix.
          unexpected="$(
            jq -r 'select(.finding and .finding.osv != "GO-2026-5932") | .finding.osv' "$report" |
              sort -u
          )"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected govulncheck findings:\n%s\n' "$unexpected"
            exit 1
          fi
      - run: go build ./...
      - run: bash tests/ci/full-race.sh
      - name: Source-to-detector prefilter boundary
        run: go test ./pkg/connectors -run '^TestSourceFixtureDetectorKeywordMatrix$' -race -count=1
      - name: CLI boundary E2E
        run: bash tests/e2e/run.sh
      - name: Crash telemetry schema contract
        run: go test ./pkg/telemetry/crash -count=1
      - name: Crash relay schema contract (vendored)
        run: node --test workers/crash-relay/crash-relay.test.js

  detector-unit:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # detector_unit-tagged tests are excluded from the plain `go test ./...`
      # run above so they can carry heavier per-detector fixtures. They must
      # still compile and pass on every push/PR — run them in their own
      # parallel job with a longer timeout instead of folding them into the
      # `test` job above.
      - run: go test -tags=detector_unit ./pkg/detectors/... -race -count=1 -timeout 15m

  opf-native:
    runs-on: [self-hosted, linux, arm64, hikae-long]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Git with offline promisor-object support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git
          git --version
      - name: Install native build configuration tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake
      - run: cmake --version
      - run: make opf-native-test
