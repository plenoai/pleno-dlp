name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go build ./...
      - run: bash tests/ci/full-race.sh
      - name: Source-to-detector prefilter boundary
        run: go test ./pkg/connectors -run '^TestSourceFixtureDetectorKeywordMatrix$' -race -count=1
      - name: CLI boundary E2E
        run: bash tests/e2e/run.sh

  detector-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # detector_unit-tagged tests are excluded from the plain `go test ./...`
      # run above so they can carry heavier per-detector fixtures. They must
      # still compile and pass on every push/PR — run them in their own
      # parallel job with a longer timeout instead of folding them into the
      # `test` job above.
      - run: go test -tags=detector_unit ./pkg/detectors/... -race -count=1 -timeout 15m
