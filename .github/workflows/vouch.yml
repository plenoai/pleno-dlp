name: Vouch
on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

# Vouch manages the trust list only. PR quality checks, content security
# scans, and contributor reports are handled by the metsuke GitHub App
# (external to this repo, tamper-proof).

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: mitchellh/vouch/action/check-pr@c6d80ead49839655b61b422700b7a3bc9d0804a9 # v1.4.2
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
          template-file: .github/vouch-unvouched.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: mitchellh/vouch/action/check-issue@c6d80ead49839655b61b422700b7a3bc9d0804a9 # v1.4.2
        with:
          issue-number: ${{ github.event.issue.number }}
          auto-close: true
          auto-lock: true
          template-file: .github/vouch-unvouched.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manage:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: mitchellh/vouch/action/manage-by-issue@c6d80ead49839655b61b422700b7a3bc9d0804a9 # v1.4.2
        with:
          issue-id: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
