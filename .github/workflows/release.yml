name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write    # SLSA provenance + GitHub attestation
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the same checks the test workflow runs.
      # `needs:` cannot reference test.yml (cross-workflow), and test.yml
      # only triggers on main pushes / PRs, never on `v*` tags. Running
      # the checks inline here guarantees a tag push cannot publish a
      # broken binary.
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go build ./...
      - run: bash tests/ci/full-race.sh
      - name: Source-to-detector prefilter boundary
        run: go test ./pkg/connectors -run '^TestSourceFixtureDetectorKeywordMatrix$' -race -count=1
      - name: CLI boundary E2E
        run: bash tests/e2e/run.sh
      # Same detector_unit-tagged suite the test workflow's detector-unit job
      # runs, gated here too so a tag push can never publish a binary whose
      # detector unit tests were never compiled/run.
      - run: go test -tags=detector_unit ./pkg/detectors/... -race -count=1 -timeout 15m

      # syft drives goreleaser's SBOM step. Pinned via the official
      # anchore install action so a typo in the binary name doesn't slip
      # through.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Mint a short-lived installation token scoped to plenoai/homebrew-tap
      # so goreleaser can push the generated formula there. The default
      # GITHUB_TOKEN is scoped to this repo only and cannot push to another
      # repository; a GitHub App token replaces a long-lived PAT — it expires
      # in ~1h, is org-owned (not tied to a person), and is repo-scoped.
      # Requires: an org-owned GitHub App with Contents:read-write installed on
      # homebrew-tap, its App ID in the HOMEBREW_TAP_APP_ID variable and its
      # private key in the HOMEBREW_TAP_APP_PRIVATE_KEY secret.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: plenoai
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
