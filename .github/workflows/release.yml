name: release
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release
  queue: max
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Tags do not trigger test.yml. Repeat every release gate here so no
      # artifact can be published from an untested tag.
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go build ./...
      - run: bash tests/ci/full-race.sh
      - name: Source-to-detector prefilter boundary
        run: go test ./pkg/connectors -run '^TestSourceFixtureDetectorKeywordMatrix$' -race -count=1
      - name: CLI boundary E2E
        run: bash tests/e2e/run.sh
      - run: go test -tags=detector_unit ./pkg/detectors/... -race -count=1 -timeout 15m

  native:
    permissions:
      attestations: write
      contents: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: cmake --version

      - name: Build native binary
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          make opf-native-build OPF_NATIVE_LDFLAGS="-s -w -X main.version=$version -X main.commit=$COMMIT"

      - name: Test native build
        run: make opf-native-test

      - name: Verify native binary provenance
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(bin/pleno-dlp-opf --version)
          expected="pleno-dlp version ${TAG#v} ($COMMIT)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::version=$actual, want $expected" >&2
            exit 1
          fi

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package archive, checksum, and SBOM
        env:
          ASSET: pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist-native/stage
          cp bin/pleno-dlp-opf dist-native/stage/pleno-dlp
          cp LICENSE README.md THIRD_PARTY_NOTICES dist-native/stage/
          tar -C dist-native/stage -czf "dist-native/${ASSET}.tar.gz" .
          cd dist-native
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          else
            shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          fi
          syft "${ASSET}.tar.gz" -o "spdx-json=${ASSET}.tar.gz.spdx.json"

      - name: Sign native archive
        env:
          ASSET: pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}
        run: cosign sign-blob --yes --bundle "dist-native/${ASSET}.tar.gz.sigstore.json" "dist-native/${ASSET}.tar.gz"

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.spdx.json

      - name: Stage native release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opf-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sigstore.json
            dist-native/pleno-dlp-opf-native_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  draft:
    needs: [quality, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect native release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opf-native-*
          path: ${{ runner.temp }}/native-release
          merge-multiple: true

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate native release inputs
        env:
          NATIVE_DIST: ${{ runner.temp }}/native-release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$NATIVE_DIST"/*)
          if [ "${#files[@]}" -ne 12 ]; then
            echo "::error::expected 12 native release files, found ${#files[@]}" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::native release input is not a regular file: $file" >&2
              exit 1
            fi
          done
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          mkdir -p dist-native
          for platform in darwin_arm64 linux_amd64 linux_arm64; do
            asset="pleno-dlp-opf-native_${platform}.tar.gz"
            test -f "$NATIVE_DIST/$asset"
            test -f "$NATIVE_DIST/$asset.sha256"
            test -f "$NATIVE_DIST/$asset.sigstore.json"
            test -f "$NATIVE_DIST/$asset.spdx.json"
            (cd "$NATIVE_DIST" && sha256sum -c "$asset.sha256")
            cosign verify-blob "$NATIVE_DIST/$asset" \
              --bundle "$NATIVE_DIST/$asset.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            jq -e '.spdxVersion | startswith("SPDX-")' "$NATIVE_DIST/$asset.spdx.json" >/dev/null
            tar -tzf "$NATIVE_DIST/$asset" ./pleno-dlp ./LICENSE ./README.md ./THIRD_PARTY_NOTICES >/dev/null
            install -m 0644 "$NATIVE_DIST/$asset" "$NATIVE_DIST/$asset.sha256" \
              "$NATIVE_DIST/$asset.sigstore.json" "$NATIVE_DIST/$asset.spdx.json" dist-native/
          done

      # GoReleaser leaves one draft containing the portable and validated
      # native assets. Publication stays deferred until provenance succeeds.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Stage Homebrew formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/homebrew/Casks/pleno-dlp.rb
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pages=$(gh api --paginate "repos/$REPO/releases?per_page=100")
          release=$(jq -e -s --arg tag "$TAG" '
            [.[][] | select(.tag_name == $tag)] |
            if length == 1 then .[0] else error("expected exactly one matching release") end
          ' <<<"$pages")
          jq -e --arg tag "$TAG" '.tag_name == $tag' <<<"$release" >/dev/null
          test "$(gh api "repos/$REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"

          expected=(
            checksums.txt checksums.txt.sigstore.json
            pleno-dlp_darwin_amd64.tar.gz pleno-dlp_darwin_amd64.tar.gz.sbom.json
            pleno-dlp_darwin_arm64.tar.gz pleno-dlp_darwin_arm64.tar.gz.sbom.json
            pleno-dlp_linux_amd64.tar.gz pleno-dlp_linux_amd64.tar.gz.sbom.json
            pleno-dlp_linux_arm64.tar.gz pleno-dlp_linux_arm64.tar.gz.sbom.json
            pleno-dlp_windows_amd64.zip pleno-dlp_windows_amd64.zip.sbom.json
            pleno-dlp_windows_arm64.zip pleno-dlp_windows_arm64.zip.sbom.json
          )
          for platform in darwin_arm64 linux_amd64 linux_arm64; do
            asset="pleno-dlp-opf-native_${platform}.tar.gz"
            expected+=("$asset" "$asset.sha256" "$asset.sigstore.json" "$asset.spdx.json")
          done
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release")
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "::error::release has ${#actual[@]} assets, want ${#expected[@]}" >&2
            exit 1
          fi
          for want in "${expected[@]}"; do
            found=false
            for got in "${actual[@]}"; do
              if [ "$got" = "$want" ]; then found=true; break; fi
            done
            if [ "$found" != true ]; then
              echo "::error::release is missing $want" >&2
              exit 1
            fi
          done

          release_id=$(jq -r '.id' <<<"$release")
          state=$(jq -r '[.draft, .immutable] | join(":")' <<<"$release")
          case "$state" in
            false:true) echo "release is already immutable"; exit 0 ;;
            true:false)
              gh api --method PATCH "repos/$REPO/releases/$release_id" --field draft=false |
                jq -e '.draft == false and .immutable == true' >/dev/null
              ;;
            *) echo "::error::unsafe release state: $state" >&2; exit 1 ;;
          esac

  homebrew:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Collect Homebrew formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/homebrew-formula

      - name: Validate Homebrew formula
        env:
          FORMULA: ${{ runner.temp }}/homebrew-formula/pleno-dlp.rb
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "$FORMULA"
          test ! -L "$FORMULA"
          test "$(find "$(dirname "$FORMULA")" -type f | wc -l | tr -d ' ')" = 1
          ruby -c "$FORMULA"
          grep -F "version \"${TAG#v}\"" "$FORMULA" >/dev/null
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            grep -F "releases/download/v#{version}/pleno-dlp_${platform}.tar.gz" "$FORMULA" >/dev/null
          done
          test "$(grep -Ec '^[[:space:]]+sha256 \"[0-9a-f]{64}\"$' "$FORMULA")" = 4

      - name: Mint Homebrew tap token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: plenoai
          repositories: homebrew-tap

      - name: Update Homebrew formula
        env:
          FORMULA: ${{ runner.temp }}/homebrew-formula/pleno-dlp.rb
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo=plenoai/homebrew-tap
          path=Casks/pleno-dlp.rb
          local_content=$(base64 < "$FORMULA" | tr -d '\n')
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          sha_args=()
          if remote=$(gh api "repos/$repo/contents/$path?ref=main" 2>"$error_file"); then
            remote_content=$(jq -r '.content' <<<"$remote" | tr -d '\n')
            if [ "$local_content" = "$remote_content" ]; then
              exit 0
            fi
            remote_formula=$(jq -r '.content' <<<"$remote" | base64 --decode)
            remote_version=$(sed -n 's/^[[:space:]]*version "\([^"]*\)"[[:space:]]*$/\1/p' <<<"$remote_formula")
            target_version=${TAG#v}
            test -n "$remote_version"
            version_order=$(ruby -e 'require "rubygems"; puts Gem::Version.new(ARGV[0]) <=> Gem::Version.new(ARGV[1])' "$remote_version" "$target_version")
            case "$version_order" in
              1) echo "tap already has newer version $remote_version; refusing downgrade to $target_version"; exit 0 ;;
              0) echo "::error::tap formula differs for existing version $target_version" >&2; exit 1 ;;
              -1) ;;
              *) echo "::error::unexpected version comparison: $version_order" >&2; exit 1 ;;
            esac
            sha=$(jq -r '.sha' <<<"$remote")
            sha_args=(--raw-field sha="$sha")
          elif ! grep -Fq "HTTP 404" "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          update_response=$(gh api --method PUT "repos/$repo/contents/$path" \
            --raw-field message="Brew formula update for pleno-dlp version $TAG" \
            --raw-field content="$local_content" \
            "${sha_args[@]}" \
            --raw-field branch=main)
          updated_ref=$(jq -er '.commit.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"$update_response")
          for attempt in 1 2 3 4 5; do
            if updated=$(gh api "repos/$repo/contents/$path?ref=$updated_ref" 2>"$error_file"); then
              if [ "$(jq -r '.content' <<<"$updated" | tr -d '\n')" = "$local_content" ]; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          cat "$error_file" >&2
          echo "::error::tap formula read-back did not match commit $updated_ref" >&2
          exit 1
