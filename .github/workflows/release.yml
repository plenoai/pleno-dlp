name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write    # SLSA provenance + GitHub attestation
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # syft drives goreleaser's SBOM step. Pinned via the official
      # anchore install action so a typo in the binary name doesn't slip
      # through.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance attestations require GitHub Advanced Security
      # or a public repo. The plenoai org currently runs this repo as
      # private without GHAS, so we skip the attestation step rather
      # than fail every release. Once the repo flips public (or GHAS
      # ships), drop the `if:` and the step lights up.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
