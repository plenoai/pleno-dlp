name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write    # SLSA provenance + GitHub attestation
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the same checks the test workflow runs.
      # `needs:` cannot reference test.yml (cross-workflow), and test.yml
      # only triggers on main pushes / PRs, never on `v*` tags. Running
      # the checks inline here guarantees a tag push cannot publish a
      # broken binary.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^_workspace\|^python' || true)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go build ./...
      - run: go test ./... -race -count=1 -timeout 5m

      # syft drives goreleaser's SBOM step. Pinned via the official
      # anchore install action so a typo in the binary name doesn't slip
      # through.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
