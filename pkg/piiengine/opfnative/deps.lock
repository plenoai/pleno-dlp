# pleno-dlp opf_native C-dependency pin lock (ADR-0005 §A).
#
# Each pin is a git commit SHA — it content-addresses the whole source
# tree, so scripts/opf-native/fetch-deps.sh verifies the resolved SHA and
# fails closed on any mismatch. Editing a pin here is the only supported
# way to move the native engine's C sources; the built .a cache in CI is
# keyed on the hash of this file.
#
# format: <name> [<git-url>] <commit-sha>
