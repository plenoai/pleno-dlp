# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: plenoai
    repo_name: pleno-dlp
    description: Unified DLP scanner for secrets and PII across filesystem, git, stdin, and SaaS sources
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        asset: pleno-secret-scanner_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: pleno-dlp
            src: pleno-secret-scanner
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 0.45.0")
        asset: pleno-dlp_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 0.67.1")
        asset: pleno-dlp_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/plenoai/pleno-dlp/\\.github/workflows/release\\.yml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: pleno-dlp_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/plenoai/pleno-dlp/\\.github/workflows/release\\.yml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        github_artifact_attestations:
          signer_workflow: plenoai/pleno-dlp/.github/workflows/release.yml
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - linux/arm64
          - darwin/arm64
          - windows/arm64
