version: 2
project_name: pleno-dlp

before:
  hooks:
    # `verify` not `tidy`: the release gate already ran `go build ./...`
    # (which fails on an inconsistent graph) and govulncheck against the
    # committed go.mod/go.sum. `tidy` could mutate the graph *after* that
    # gate, shipping a module set neither check validated; `verify` only
    # confirms the existing modules match their hashes.
    - go mod verify

builds:
  - id: pleno-dlp
    main: ./cmd/pleno-dlp
    binary: pleno-dlp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

signs:
  - cmd: cosign
    args:
      - sign-blob
      - ${artifact}
      - --yes
      - --bundle=${signature}
    artifacts: checksum
    signature: "${artifact}.sigstore.json"

# Software Bill of Materials per release artifact. anchore/syft is the
# de-facto standard SBOM generator GitHub's attestation action accepts.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

release:
  prerelease: auto
  draft: false
  footer: |
    ---
    `checksums.txt` is signed with Sigstore keyless (cosign). Verify with:
    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp \
        'https://github.com/plenoai/pleno-dlp/.github/workflows/release.yml@refs/tags/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
    Or verify checksums only (no cryptographic signing):
    ```
    sha256sum -c checksums.txt
    ```
    Build-provenance attestations (`gh attestation verify`) require a
    public repo or GHAS and are skipped while this repo is private.

changelog:
  use: github
  sort: asc
  groups:
    - title: 'New detectors'
      regexp: '^.*?feat\(detectors\)'
      order: 0
    - title: 'New sources'
      regexp: '^.*?feat\(sources\)'
      order: 1
    - title: 'Engine and CLI'
      regexp: '^.*?feat'
      order: 2
    - title: 'Bug fixes'
      regexp: '^.*?fix'
      order: 3
    - title: 'Other'
      order: 999
