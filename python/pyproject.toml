[project]
name = "pleno-dlp"
version = "0.12.0"
description = "Unified DLP scanner for SaaS sources — secret detection (trufflehog, gitleaks, native regex) plus PII detection (pleno-anonymize). API-driven content collection from GitHub, GitLab, Bitbucket, Slack, Notion, Confluence, Jira."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "pleno", email = "ai@egahika.dev" }]
keywords = ["dlp", "secrets", "pii", "scanner", "trufflehog", "gitleaks", "saas", "anonymize"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Reserved for an in-process pleno-anonymize binding once that wheel
# stabilises; today the `pii` backend uses the HTTP API, which needs no
# extras beyond the base install.
pii = []

[project.scripts]
pleno-dlp = "pleno_dlp.cli:app"

[project.urls]
Homepage = "https://github.com/plenoai/pleno-dlp"
Repository = "https://github.com/plenoai/pleno-dlp"
Issues = "https://github.com/plenoai/pleno-dlp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pleno_dlp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic CLI signatures rely on `typer.Option(...)` defaults.
"src/pleno_dlp/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
