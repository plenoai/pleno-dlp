# openaipf-server: thin FastAPI wrapper around openai/privacy-filter (opf).
#
# Distribution model: not on PyPI. pleno-dlp's openai-pf-server subcommand
# materializes this package on first use via:
#   uvx --from "git+https://github.com/plenoai/pleno-dlp.git#subdirectory=python/openaipf-server" \
#       python -m openaipf_server --host 127.0.0.1 --port {PORT} --device {DEVICE}
# uv resolves and caches the environment; subsequent runs are warm-start.
#
# Pinning policy: opf is on a 0.x trajectory; we install from git rather
# than PyPI because the upstream PyPI release cadence lags HEAD. The
# Go supervisor's 300s ready timeout absorbs cold weight download.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openaipf-server"
version = "0.1.0"
description = "Loopback HTTP wrapper around openai/privacy-filter for pleno-dlp"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  # opf has no upstream HTTP server and no PyPI release we want to pin
  # against; install from git so the wrapper's lockfile cadence is owned
  # by pleno-dlp (ADR-0004 §2). The distribution name is `opf` (the name
  # in the upstream pyproject) — a PEP 508 `name @ url` requirement must
  # match that exactly or uv/pip abort with "Package metadata name 'opf'
  # does not match given name", which silently disabled the engine.
  "opf @ git+https://github.com/openai/privacy-filter.git",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
]

[project.scripts]
# Surfaced for ad-hoc local use (`uvx openaipf-server ...`). The pleno-dlp
# CLI invokes the module-form `python -m openaipf_server` so an alternate
# console_script name (or missing entry) does not break the integration.
openaipf-server = "openaipf_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openaipf_server"]

[tool.hatch.metadata]
# Required because the opf dependency is a git+ URL (PEP 508 direct
# reference); hatch refuses these by default to discourage non-PyPI
# distributions.
allow-direct-references = true
